name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: version
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          if [ -z "$version" ]; then
            echo "frontend/package.json 中缺少版本号" >&2
            exit 1
          fi
          tag="v$version"
          if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "标签 $GITHUB_REF_NAME 与 frontend/package.json 的版本 $version 不一致" >&2
            echo "请修改版本号后重新打标签，或改用 Actions 页面手动运行" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次发布版本 $tag"

      - name: 生成压缩包
        run: |
          mkdir -p dist
          tag="${{ steps.version.outputs.tag }}"
          zip="dist/ModernMirror-$tag.zip"
          git archive --format=zip --prefix="ModernMirror-$tag/" -o "$zip" HEAD
          ls -lh "$zip"
          unzip -l "$zip"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          zip="dist/ModernMirror-$tag.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --title "$tag" --generate-notes
          fi
